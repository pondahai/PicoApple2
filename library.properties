# Apple2Core - Arduino 程式庫描述檔
#
# 這份的內容必須跟 loader_offset/make_arduino_lib.py 裡的 LIBRARY_PROPERTIES
# 一致。那支腳本在 build 時會生成一份自足的程式庫給 arduino-cli 用,不讀這個
# 檔案 —— 這裡留著是給「手動把這個 repo 當成 Arduino 程式庫安裝」的情境用的。
#
# precompiled=true + ldflags=-lapple2_core 是唯一能動的組合:
#   .a 放在 src/cortex-m0plus/libapple2_core.a,arduino-cli 會自動補 -L,
#   ldflags 則會被放進 link 指令的正確位置(--start-group 內、sketch 的
#   object 之後)。archive 若排在需要它的 object 之前,ld 會整包跳過,
#   症狀是一整排 undefined reference to `apple2_*`。
#
# 這裡原本寫的是 dot_a_linkage=true,那是壞的:它會叫 arduino-cli 去找一個
# 「由本程式庫自己的原始碼編出來的」Apple2Core.a,而這個程式庫沒有原始碼,
# 於是 link 階段報「找不到 Apple2Core.a」。當年有人在自己的 sketchbook 裡把
# 它改成 precompiled 修好了,但那個修正一直沒有回流到 repo,導致版本裡的這份
# 從此是壞的,而唯一能動的那份只存在於一台機器的一個資料夾裡。
name=Apple2Core
version=0.1.0
author=Rust
maintainer=Rust
sentence=Apple II Core for Pico
paragraph=Precompiled Rust static library for Apple II emulation.
category=Other
url=none
architectures=rp2040
precompiled=true
ldflags=-lapple2_core
includes=Apple2Core.h
